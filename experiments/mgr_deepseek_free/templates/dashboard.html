<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Track • Cosmic UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;500&display=swap');
        body { font-family: 'Inter', sans-serif; background: radial-gradient(ellipse at 20% 50%, #0a0f1e, #02040a); }
        .cosmic-card { background: rgba(16, 20, 35, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(0, 255, 255, 0.15); }
        .neon-glow { box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), 0 0 40px rgba(128, 0, 255, 0.2); }
        .neon-text { text-shadow: 0 0 10px rgba(0, 255, 255, 0.6); }
        .btn-sync { background: linear-gradient(135deg, #0ff, #a855f7); box-shadow: 0 0 25px rgba(0, 255, 255, 0.5); transition: all 0.3s ease; }
        .btn-sync:hover { box-shadow: 0 0 40px rgba(0, 255, 255, 0.8); transform: scale(1.02); }
        .btn-add { background: linear-gradient(135deg, #a855f7, #0ff); box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }
        .btn-add:hover { box-shadow: 0 0 30px rgba(168, 85, 247, 0.8); transform: scale(1.02); }
        .spinner { border: 3px solid rgba(255,255,255,0.2); border-top: 3px solid cyan; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input:focus { outline: none; border-color: #0ff; box-shadow: 0 0 10px rgba(0,255,255,0.3); }
    </style>
</head>
<body class="min-h-screen text-gray-100">

    <!-- Header -->
    <header class="py-6 px-8 flex items-center justify-between border-b border-cyan-900/40">
        <h1 class="text-3xl font-bold font-['Orbitron'] neon-text text-cyan-300 tracking-widest">FINANCE TRACK</h1>
        <span class="text-sm uppercase tracking-wide text-purple-300">Cosmic UI v1.0</span>
    </header>

    <!-- Stats Bar -->
    <section class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="cosmic-card rounded-2xl p-6 flex flex-col items-center justify-center">
            <span class="text-sm uppercase tracking-wider text-cyan-400">System Status</span>
            <span id="statusIndicator" class="mt-2 text-2xl font-bold text-green-400">● Online</span>
        </div>
        <div class="cosmic-card rounded-2xl p-6 flex flex-col items-center justify-center">
            <span class="text-sm uppercase tracking-wider text-cyan-400">Tracked Assets</span>
            <span id="totalAssets" class="mt-2 text-4xl font-bold text-white">0</span>
        </div>
        <div class="cosmic-card rounded-2xl p-6 flex items-center justify-center">
            <button id="syncBtn" onclick="triggerSync()" class="btn-sync px-8 py-3 rounded-full font-semibold text-gray-900 flex items-center gap-3">
                <span id="syncText">🔄 Sync Prices</span>
                <span id="spinner" class="spinner hidden"></span>
            </button>
        </div>
    </section>

    <!-- Add Asset Form -->
    <section class="max-w-7xl mx-auto px-6 pb-4">
        <div class="cosmic-card rounded-2xl p-6 flex items-center gap-4">
            <div class="flex-1">
                <label for="newTicker" class="block text-sm uppercase tracking-wider text-cyan-400 mb-1">Add New Ticker</label>
                <input id="newTicker" type="text" placeholder="e.g. AAPL" 
                       class="w-full bg-gray-900 border border-cyan-800 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition-all uppercase"
                       maxlength="5" autocomplete="off">
            </div>
            <div class="flex items-end">
                <button id="addBtn" onclick="addAsset()" class="btn-add px-8 py-3 rounded-full font-semibold text-gray-900 flex items-center gap-2 mt-6">
                    <span id="addText">➕ Add Asset</span>
                    <span id="addSpinner" class="spinner hidden"></span>
                </button>
            </div>
        </div>
        <p id="addError" class="text-red-400 text-sm mt-2 hidden"></p>
    </section>

    <!-- Assets Table -->
    <section class="max-w-7xl mx-auto px-6 pb-12">
        <div class="cosmic-card rounded-2xl overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-cyan-900/20 text-cyan-300 uppercase text-xs tracking-widest">
                    <tr>
                        <th class="px-6 py-4">Ticker</th>
                        <th class="px-6 py-4">Last Price</th>
                        <th class="px-6 py-4">Market Cap</th>
                        <th class="px-6 py-4">Updated</th>
                    </tr>
                </thead>
                <tbody id="assetTableBody" class="divide-y divide-gray-800">
                    <!-- Rows injected by JavaScript -->
                </tbody>
            </table>
            <div id="emptyState" class="text-center py-12 text-gray-500">Loading assets…</div>
        </div>
    </section>

    <script>
        // --- Utility functions ---
        function formatMarketCap(value) {
            if (!value) return 'N/A';
            if (value >= 1e12) return (value / 1e12).toFixed(2) + ' T';
            if (value >= 1e9) return (value / 1e9).toFixed(2) + ' B';
            if (value >= 1e6) return (value / 1e6).toFixed(2) + ' M';
            return value.toLocaleString();
        }

        function formatDate(timestamp) {
            if (!timestamp) return 'N/A';
            const date = new Date(timestamp);
            return date.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        // --- Status check ---
        async function fetchStatus() {
            try {
                const res = await fetch('/status');
                const data = await res.json();
                const indicator = document.getElementById('statusIndicator');
                if (data.status === 'ok') {
                    indicator.textContent = '● Online';
                    indicator.classList.add('text-green-400');
                    indicator.classList.remove('text-red-400');
                } else {
                    indicator.textContent = '● Degraded';
                    indicator.classList.add('text-red-400');
                }
            } catch (e) {
                const indicator = document.getElementById('statusIndicator');
                indicator.textContent = '● Offline';
                indicator.classList.add('text-red-400');
                indicator.classList.remove('text-green-400');
            }
        }

        // --- Load and render assets ---
        async function loadAssets() {
            try {
                const res = await fetch('/assets?limit=100');
                if (!res.ok) throw new Error('Failed to fetch assets');
                const assets = await res.json();
                // Ensure assets is an array
                if (!Array.isArray(assets)) {
                    throw new Error('Invalid response format');
                }
                document.getElementById('totalAssets').textContent = assets.length;

                const tbody = document.getElementById('assetTableBody');
                const empty = document.getElementById('emptyState');
                tbody.innerHTML = '';
                if (assets.length === 0) {
                    empty.classList.remove('hidden');
                    empty.textContent = 'No assets found. Add some using the form above.';
                } else {
                    empty.classList.add('hidden');
                    assets.forEach(asset => {
                        const row = document.createElement('tr');
                        row.className = 'hover:bg-cyan-900/10 transition-colors';
                        row.innerHTML = `
                            <td class="px-6 py-4 font-medium text-cyan-200">${asset.tickerSymbol}</td>
                            <td class="px-6 py-4 text-purple-200">$${asset.lastPrice.toFixed(2)}</td>
                            <td class="px-6 py-4">${formatMarketCap(asset.marketCap)}</td>
                            <td class="px-6 py-4 text-sm text-gray-400">${formatDate(asset.lastUpdated)}</td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            } catch (error) {
                console.error('Error loading assets:', error);
                document.getElementById('emptyState').textContent = 'Failed to load assets.';
            }
        }

        // --- Add new asset ---
        async function addAsset() {
            const input = document.getElementById('newTicker');
            const ticker = input.value.trim().toUpperCase();
            const errorEl = document.getElementById('addError');
            errorEl.classList.add('hidden');

            if (!ticker) {
                errorEl.textContent = 'Please enter a ticker symbol.';
                errorEl.classList.remove('hidden');
                return;
            }
            if (!/^[A-Z]{1,5}$/.test(ticker)) {
                errorEl.textContent = 'Invalid ticker. Use 1-5 uppercase letters.';
                errorEl.classList.remove('hidden');
                return;
            }

            const addBtn = document.getElementById('addBtn');
            const addText = document.getElementById('addText');
            const addSpinner = document.getElementById('addSpinner');
            addBtn.disabled = true;
            addText.textContent = 'Adding…';
            addSpinner.classList.remove('hidden');
            errorEl.classList.add('hidden');

            try {
                const payload = {
                    tickerSymbol: ticker,
                    lastPrice: 0.0,
                    marketCap: 0
                };
                const res = await fetch('/assets', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const errorData = await res.json();
                    throw new Error(errorData.detail || 'Failed to create asset');
                }
                // Success: clear input, refresh table
                input.value = '';
                await loadAssets();
            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.classList.remove('hidden');
            } finally {
                addBtn.disabled = false;
                addText.textContent = '➕ Add Asset';
                addSpinner.classList.add('hidden');
            }
        }

        // --- Sync all prices ---
        async function triggerSync() {
            const btn = document.getElementById('syncBtn');
            const text = document.getElementById('syncText');
            const spinner = document.getElementById('spinner');
            btn.disabled = true;
            text.textContent = 'Syncing...';
            spinner.classList.remove('hidden');
            try {
                const res = await fetch('/assets/sync', { method: 'POST' });
                const result = await res.json();
                alert(`Sync complete: ${result.updated} updated, ${result.skipped} skipped, ${result.failed} failed.`);
            } catch (e) {
                alert('Sync failed. Check logs.');
            } finally {
                btn.disabled = false;
                text.textContent = '🔄 Sync Prices';
                spinner.classList.add('hidden');
                await loadAssets(); // Refresh table after sync
            }
        }

        // --- Initialise ---
        (async () => {
            await fetchStatus();
            await loadAssets();
        })();
    </script>
</body>
</html>
